name: fitmanager
description: "FitManager - mobilna aplikacija za upravljanje teretanom."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

# Zavisnosti se dodaju komandom (upisuje najnovije kompatibilne verzije):
# flutter pub add provider go_router dio flutter_secure_storage flutter_dotenv
# flutter pub add --dev flutter_lints
dependencies:
  dio: ^5.11.1
  flutter:
    sdk: flutter
  flutter_dotenv: ^6.0.1
  flutter_secure_storage: ^11.2.0
  go_router: ^18.1.4
  provider: ^6.1.5+1

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/images/
